# Pre-commit hooks para MSP_AXS
# Instalación: pre-commit install
# Ejecución manual: pre-commit run --all-files

repos:
  # Hooks estándar de Python
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        args: ['--maxkb=500']
        name: Check for large files
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-json
        name: Check JSON syntax
      - id: check-toml
        name: Check TOML syntax
      - id: debug-statements
        name: Check for debugger statements
      - id: mixed-line-ending
        name: Check line endings

  # Black: formateo de código Python
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: Format code with Black
        language_version: python3.12
        args: ['--line-length=100']

  # isort: ordenamiento de imports
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort imports 
with isort
        args: ['--profile=black', '--line-length=100']

  # Flake8: linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Lint with Flake8
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']

  # MyPy: type checking (opcional)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: Type check with MyPy
        additional_dependencies: [types-all]
        args: ['--ignore-missing-imports', '--no-strict-optional']
        exclude: '^(tests/|scripts/)'

  # Pytest check: ejecutar tests antes de commit
  - repo: local
    hooks:
      - id: pytest-check
        name: Run pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        args: ['tests/', '-x', '--tb=short', '-q']
        stages: [commit]

# Configuración global
default_language_version:
  python: python3.12

# Archivos/directorios excluidos
exclude: |
  (?x)^(
      .*\.pyc|
      .*\.pyo|
      .*\.pyd|
      \.git/|
      \.pytest_cache/|
      __pycache__/|
      \.venv/|
      venv/|
      \.coverage|
      htmlcov/|
      \.mypy_cache/|
      backend/db/models_DEPRECATED\.py
  )$
