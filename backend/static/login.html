<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSP AXS - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #667eea;
            font-size: 32px;
            font-weight: 700;
        }
        
        .logo p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .auto-login {
            background: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .token-display {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
        }
        
        .credentials {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
        }
        
        .credentials strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🔐 MSP AXS</h1>
            <p>Sistema de Gestión de Accesos</p>
        </div>
        
        <div id="autoLoginMessage" class="auto-login" style="display: none;">
            ⏳ Iniciando sesión automáticamente...
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="test@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" value="test123" required>
            </div>
            
            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="credentials">
            <strong>📝 Credenciales por defecto:</strong><br>
            Email: test@example.com<br>
            Password: test123
        </div>
    </div>

    <script>
        // Detectar la URL base automáticamente
        const API_URL = window.location.origin;
        
        console.log('🔧 API_URL:', API_URL);
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            messageDiv.style.display = 'none';
            
            try {
                console.log('📡 Enviando login a:', `${API_URL}/auth/login`);
                
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                console.log('📡 Respuesta:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    const token = data.access_token;
                    
                    // Guardar en localStorage
                    localStorage.setItem('token', token);
                    
                    // Mostrar mensaje de éxito
                    messageDiv.className = 'message success';
                    messageDiv.style.display = 'block';
                    messageDiv.innerHTML = `
                        <strong>✅ Login exitoso!</strong><br>
                        Token guardado en localStorage.<br>
                        <div class="token-display">${token}</div>
                    `;
                    
                    console.log('✅ Token guardado:', token.substring(0, 50) + '...');
                    
                    // Redirigir a admin después de 2 segundos
                    setTimeout(() => {
                        window.location.href = '/admin.html';
                    }, 2000);
                    
                } else {
                    const error = await response.text();
                    messageDiv.className = 'message error';
                    messageDiv.style.display = 'block';
                    messageDiv.innerHTML = `<strong>❌ Error de autenticación</strong><br>${error}`;
                    console.error('❌ Error:', error);
                }
                
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                messageDiv.innerHTML = `<strong>❌ Error de conexión</strong><br>${error.message}`;
                console.error('❌ Error:', error);
            }
        });
        
        // Auto-login al cargar la página
        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const autoLogin = urlParams.get('auto');
            
            if (autoLogin === 'true') {
                document.getElementById('autoLoginMessage').style.display = 'block';
                document.getElementById('loginForm').style.display = 'none';
                
                // Simular submit del formulario
                setTimeout(() => {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }, 500);
            }
        });
    </script>
</body>
</html>
