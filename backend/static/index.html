<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSP AXS - Preregistro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 20px;
      color: #333;
      font-size: 24px;
    }
    .admin-link {
      display: block;
      text-align: center;
      padding: 10px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      margin-bottom: 20px;
      font-weight: 600;
      transition: background 0.3s;
    }
    
    .guard-link {
      display: block;
      text-align: center;
      padding: 10px;
      background: #10b981;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      margin-bottom: 20px;
      font-weight: 600;
      transition: background 0.3s;
    }
    
    .guard-link:hover {
      background: #059669;
    }
    .admin-link:hover {
      background: #5568d3;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
    }
    textarea {
      font-family: system-ui, -apple-system, sans-serif;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #1976D2;
    }
    button:active {
      background: #1565C0;
    }
    .error {
      margin-top: 15px;
      padding: 15px;
      background: #ffebee;
      border: 1px solid #c62828;
      border-radius: 6px;
      color: #c62828;
      font-weight: 500;
    }
    .success {
      margin-top: 15px;
      padding: 15px;
      background: #e8f5e9;
      border: 1px solid #4caf50;
      border-radius: 6px;
      color: #2e7d32;
      font-weight: 500;
    }
    .ultima-accion {
      margin-top: 15px;
      padding: 10px;
      background: #fff3e0;
      border: 1px solid #ff9800;
      border-radius: 6px;
      font-size: 14px;
    }
    .qr-container {
      margin-top: 20px;
      text-align: center;
      padding: 15px;
      background: #e8f5e9;
      border: 1px solid #4caf50;
      border-radius: 6px;
      color: #2e7d32;
      font-weight: 500;
      line-height: 1.8;
    }
    .qr-container h3 {
      margin-bottom: 15px;
      color: #333;
    }
    .qr-container img {
      max-width: 300px;
      width: 100%;
      border: 2px solid #333;
      border-radius: 8px;
    }
    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginForm" style="display:block;">
      <h1>🔐 Login - MSP AXS</h1>
      <a href="/admin.html" class="admin-link">🏢 Panel de Administración</a>
        <a class="guard-link" href="/guardia.html">🛡️ Modo Guardia (Acceso)</a>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button onclick="login()">Ingresar</button>
      <div id="loginError" class="error" style="display:none;"></div>
      <div class="footer" style="margin-top:20px;">
        <strong>Demo:</strong> test@example.com / test123
      </div>
    </div>
    
    <div id="appForm" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h1>🏢 Preregistro de Visitas</h1>
        <button onclick="logout()" style="width:auto; padding:8px 15px; font-size:14px;">Salir</button>
      </div>
      
      <a href="/admin.html" class="admin-link">🏢 Ir a Panel de Administración</a>
      
      <input type="text" id="nombre" placeholder="Nombre del visitante" required>
      <input type="datetime-local" id="fecha" required>
      
      <select id="tipo">
        <option value="Visita">Visita</option>
        <option value="Servicio">Servicio</option>
      </select>
      
      <input type="text" id="placa" placeholder="Placas (opcional)">
      <textarea id="notas" rows="3" placeholder="Notas adicionales"></textarea>
      
      <button onclick="generarQR()">Generar QR</button>
    </div>
    
    <div id="error" class="error" style="display:none;"></div>
    <div id="success" class="success" style="display:none;"></div>
    <div id="ultimaAccion" class="ultima-accion" style="display:none;"></div>
    
    <div id="qrContainer" class="qr-container" style="display:none;">
      <h3>QR Generado:</h3>
      <img id="qrImg" alt="Código QR">
    </div>
    
    <div class="footer">
      MSP AXS - Sistema gobernado por AUP
    </div>
  </div>

  <script>
    // Variables globales
    const API_URL = window.location.origin;
    let token = localStorage.getItem('auth_token');
    
    console.log('📱 API_URL:', API_URL);
    console.log('🔐 Token en localStorage:', token ? token.substring(0, 20) + '...' : 'NO HAY TOKEN');
    
    // Mostrar formulario según autenticación
    if (token) {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('appForm').style.display = 'block';
    }
    
    // ═════════════════════════════════════════════════════════════════════
    // LOGIN
    // ═════════════════════════════════════════════════════════════════════
    
    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        mostrarErrorLogin('Por favor completa email y contraseña');
        return;
      }
      
      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            password: password
          })
        });
        
        const data = await res.json();
        
        console.log('📨 Respuesta login:', res.status, data);
        
        if (!res.ok) {
          // Manejar diferentes tipos de errores
          let errorMsg = 'Login falló';
          
          if (data.detail) {
            if (typeof data.detail === 'string') {
              errorMsg = data.detail;
            } else if (Array.isArray(data.detail)) {
              // Errores de validación de Pydantic
              errorMsg = data.detail.map(err => 
                err.msg || err.detail || JSON.stringify(err)
              ).join('; ');
            } else if (typeof data.detail === 'object') {
              errorMsg = JSON.stringify(data.detail);
            }
          }
          
          mostrarErrorLogin(errorMsg);
          return;
        }
        
        if (data.access_token) {
          // Guardar token
          token = data.access_token;
          console.log('✅ Token recibido y guardado:', token.substring(0, 20) + '...');
          localStorage.setItem('auth_token', token);
          
          // Verificar que se guardó
          const tokenGuardado = localStorage.getItem('auth_token');
          console.log('✅ Token verificado en localStorage:', tokenGuardado ? tokenGuardado.substring(0, 20) + '...' : 'NO SE GUARDÓ');
          
          // Cambiar vista
          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('appForm').style.display = 'block';
          
          // Limpiar campos
          document.getElementById('email').value = '';
          document.getElementById('password').value = '';
          document.getElementById('loginError').style.display = 'none';
        }
      } catch (err) {
        console.error('Error:', err);
        mostrarErrorLogin('Error de conexión con el servidor');
      }
    }
    
    function mostrarErrorLogin(msg) {
      const el = document.getElementById('loginError');
      el.innerHTML = '❌ ' + msg;
      el.style.display = 'block';
    }
    
    function logout() {
      localStorage.removeItem('auth_token');
      token = null;
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('appForm').style.display = 'none';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
    }
    
    // ═════════════════════════════════════════════════════════════════════
    // GENERAR QR
    // ═════════════════════════════════════════════════════════════════════
    
    async function generarQR() {
      // Limpiar mensajes previos
      document.getElementById('error').style.display = 'none';
      document.getElementById('success').style.display = 'none';
      document.getElementById('ultimaAccion').style.display = 'none';
      document.getElementById('qrContainer').style.display = 'none';
      
      const nombre = document.getElementById('nombre').value.trim();
      const fecha = document.getElementById('fecha').value;
      const tipo = document.getElementById('tipo').value;
      const placa = document.getElementById('placa').value.trim() || null;
      const notas = document.getElementById('notas').value.trim() || null;
      
      // Validación básica
      if (!nombre) {
        mostrarError('Por favor ingresa el nombre del visitante');
        return;
      }
      
      if (!fecha) {
        mostrarError('Por favor selecciona la fecha y hora de visita');
        return;
      }
      
      try {
        // Calcular días de vigencia desde fecha de visita hasta hoy
        const fechaVisita = new Date(fecha);
        const hoy = new Date();
        const diasDiferencia = Math.ceil((fechaVisita - hoy) / (1000 * 60 * 60 * 24));
        const diasVigencia = Math.max(1, Math.min(diasDiferencia, 30)); // Entre 1 y 30 días
        
        const payload = {
          visitante_nombre: nombre,
          tenant_id: "default_tenant",  // Usando tenant por defecto
          dias_vigencia: diasVigencia
        };
        
        // UI-AUP-01: Endpoint gobernado por AUP
        const res = await fetch(`${API_URL}/qr/generar_gobernado`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        
        // UI-AUP-02: Manejo explícito de respuestas AUP
        if (res.status === 401) {
          mostrarError('⚠️ Sesión no válida o expirada. Acceso no autorizado.');
          registrarAccion('Generación de QR', 'DENEGADA');
          return;
        }
        
        if (res.status === 403) {
          mostrarError('⚠️ Acceso denegado por política del condominio. Este intento fue registrado.');
          registrarAccion('Generación de QR', 'DENEGADA');
          return;
        }
        
        if (!res.ok) {
          // Manejar diferentes tipos de errores
          let errorMsg = 'Error al generar QR';
          
          if (data.detail) {
            if (typeof data.detail === 'string') {
              errorMsg = data.detail;
            } else if (Array.isArray(data.detail)) {
              errorMsg = data.detail.map(err => 
                err.msg || err.detail || JSON.stringify(err)
              ).join('; ');
            } else if (typeof data.detail === 'object') {
              errorMsg = JSON.stringify(data.detail);
            }
          }
          
          mostrarError(errorMsg);
          return;
        }
        
        // UI-AUP-03: Mostrar éxito y evidencia
        if (data.qr_id) {
          // Mostrar datos del QR generado
          const qrInfo = `
            <strong>✅ QR Generado Exitosamente</strong><br>
            📱 ID: ${data.qr_id}<br>
            👤 Visitante: ${data.visitante}<br>
            🏢 Tenant: ${data.tenant_id}<br>
            🔑 Token: ${data.qr_token}<br>
            📅 Vigencia hasta: ${new Date(data.vigencia_hasta).toLocaleString('es-MX')}
          `;
          
          document.getElementById('qrContainer').innerHTML = qrInfo;
          document.getElementById('qrContainer').style.display = 'block';
          mostrarExito('✅ QR generado exitosamente y registrado en el sistema');
          registrarAccion('Generación de QR', 'AUTORIZADA');
          
          // Limpiar formulario
          document.getElementById('nombre').value = '';
          document.getElementById('fecha').value = '';
          document.getElementById('placa').value = '';
          document.getElementById('notas').value = '';
        }
      } catch (err) {
        console.error('Error:', err);
        mostrarError('❌ Error de conexión con el servidor');
      }
    }
    
    function mostrarError(mensaje) {
      const el = document.getElementById('error');
      el.innerHTML = mensaje;
      el.style.display = 'block';
    }
    
    function mostrarExito(mensaje) {
      const el = document.getElementById('success');
      el.innerHTML = mensaje;
      el.style.display = 'block';
    }
    
    // UI-AUP-03: Registro de última acción (evidencia visible)
    function registrarAccion(accion, resultado) {
      const el = document.getElementById('ultimaAccion');
      const timestamp = new Date().toLocaleTimeString('es-MX');
      el.innerHTML = `<strong>Última acción registrada:</strong><br>🕒 ${timestamp} — ${accion} (${resultado})`;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
