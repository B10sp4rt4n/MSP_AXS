name: PostgreSQL RLS gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create isolated non-bypass role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE axs_rls_ci LOGIN PASSWORD 'ci-only' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE axs_rls_ci OWNER axs_rls_ci"
      - name: Verify RLS and transaction context
        env:
          AXS_TEST_POSTGRES_URL: postgresql+psycopg://axs_rls_ci:ci-only@localhost:5432/axs_rls_ci
        run: python -m pytest -q --no-cov tests/smoke/test_postgres_rls.py tests/smoke/test_tenant_isolation.py
