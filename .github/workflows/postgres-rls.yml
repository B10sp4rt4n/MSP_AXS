name: PostgreSQL RLS gate

on:
  push:
    branches: ['feat/axs-corporativo-c3-superadmin-portal-20261023']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres-rls:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Official PostgreSQL image on Docker Hub; ECR Public hit its download quota.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create isolated non-bypass role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE axs_rls_ci LOGIN PASSWORD 'ci-only' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE axs_rls_ci OWNER axs_rls_ci"
      - name: Verify RLS and transaction context
        env:
          AXS_TEST_POSTGRES_URL: postgresql+psycopg://axs_rls_ci:ci-only@localhost:5432/axs_rls_ci
          AXS_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/axs_rls_ci
          AXS_RULES_TEST_POSTGRES_URL: postgresql+psycopg://axs_rls_ci:ci-only@localhost:5432/axs_rls_ci
        run: python -m pytest -q --no-cov tests/smoke/test_postgres_rls.py tests/smoke/test_arco_postgres.py tests/smoke/test_tenant_modalidad_postgres.py tests/smoke/test_corporate_directory_postgres.py tests/smoke/test_corporate_superadmin_postgres.py tests/smoke/test_corporate_bootstrap_http_postgres.py tests/smoke/test_corporate_schemas_fresh_postgres.py tests/smoke/test_tenant_isolation.py tests/smoke/test_event_outbox_postgres.py tests/smoke/test_security_outbox_postgres.py tests/smoke/test_outbox_recovery_postgres.py tests/smoke/test_provider_boundary_postgres.py tests/test_reglas_acceso.py tests/test_solicitudes_acceso.py tests/smoke/test_solicitudes_acceso_postgres.py tests/smoke/test_progressive_identity_postgres.py tests/smoke/test_restore_drill_postgres.py tests/test_recovery_mode.py tests/test_provider_offboarding.py tests/test_provider_contracts.py
      - name: Export corporate sandbox DDL without secrets
        if: success()
        env:
          AXS_EXPORT_SANDBOX_DDL: schema-only
        run: python scripts/export_corporate_sandbox_ddl.py
