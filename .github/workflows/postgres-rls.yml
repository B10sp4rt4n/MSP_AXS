name: PostgreSQL RLS gate

on:
  push:
    branches: ['feat/axs-corporativo-c[1235]-*', 'fix/axs-corporativo-*']
  pull_request:
    branches: [main, 'feat/axs-corporativo-*', 'fix/axs-corporativo-*']
  workflow_dispatch:

jobs:
  postgres-rls:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Official PostgreSQL image on Docker Hub; ECR Public hit its download quota.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create isolated non-bypass role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE axs_rls_ci LOGIN PASSWORD 'ci-only' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE axs_rls_ci OWNER axs_rls_ci"
      - name: Verify RLS and transaction context
        env:
          AXS_TEST_POSTGRES_URL: postgresql+psycopg://axs_rls_ci:ci-only@localhost:5432/axs_rls_ci
          AXS_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/axs_rls_ci
          AXS_RULES_TEST_POSTGRES_URL: postgresql+psycopg://axs_rls_ci:ci-only@localhost:5432/axs_rls_ci
        run: python -m pytest -q --no-cov tests/smoke/test_postgres_rls.py tests/smoke/test_arco_postgres.py tests/smoke/test_tenant_modalidad_postgres.py tests/smoke/test_corporate_directory_postgres.py tests/smoke/test_corporate_superadmin_postgres.py tests/smoke/test_corporate_bootstrap_http_postgres.py tests/smoke/test_corporate_reconciliation_postgres.py tests/smoke/test_corporate_schemas_fresh_postgres.py tests/smoke/test_corporate_sandbox_runtime_postgres.py tests/smoke/test_tenant_isolation.py tests/smoke/test_event_outbox_postgres.py tests/smoke/test_security_outbox_postgres.py tests/smoke/test_outbox_recovery_postgres.py tests/smoke/test_provider_boundary_postgres.py tests/test_reglas_acceso.py tests/test_solicitudes_acceso.py tests/smoke/test_solicitudes_acceso_postgres.py tests/smoke/test_progressive_identity_postgres.py tests/smoke/test_restore_drill_postgres.py tests/test_recovery_mode.py tests/test_provider_offboarding.py tests/test_provider_contracts.py tests/smoke/test_tenant_modalidad_http_postgres.py tests/smoke/test_corporate_arco_postgres.py
      - name: Rehearse legacy corporate upgrade and read-only schema gate
        env:
          AXS_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/axs_rls_ci
        run: python -m pytest -q --no-cov tests/smoke/test_corporate_upgrade_postgres.py
      - name: Export corporate sandbox DDL without secrets
        if: success()
        env:
          AXS_EXPORT_SANDBOX_DDL: schema-only
        run: python -m scripts.export_corporate_sandbox_ddl

  corporate-target-catalog:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Match the captured production CORE major version, independently of PG16.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve pinned production model for rollback rehearsal
        run: |
          git fetch --no-tags --depth=1 origin 76bc9d619836f0872241741570fb7974e51d2bf6
          git show 76bc9d619836f0872241741570fb7974e51d2bf6:backend/db/core/models.py > /tmp/axs_upgrade_legacy_models.py
      - name: Verify captured catalog, upgrade, runtime isolation and legacy rollback
        env:
          AXS_TEST_TARGET_SCHEMA_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          AXS_TEST_LEGACY_CORE_MODELS: /tmp/axs_upgrade_legacy_models.py
        run: python -m pytest -q --no-cov tests/smoke/test_corporate_target_catalog_postgres.py

