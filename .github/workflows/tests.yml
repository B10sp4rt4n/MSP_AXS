name: Tests

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  provider-console-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-next/package-lock.json
    - run: npm ci
    - run: npm install --no-save --package-lock=false playwright@1.58.2
    - run: npx playwright install --with-deps chromium
    - run: node tests/preregistro-admin.browser.cjs
    - run: node tests/reportes-operacion.browser.cjs
    - run: node tests/resident-import.browser.cjs
    - run: node tests/admin-empty.browser.cjs
    - run: node tests/multiple-residents.browser.cjs
    - run: node tests/onboarding.browser.cjs
    - run: node tests/guardia-flow.browser.cjs
    - run: node tests/solicitudes-acceso.browser.cjs
    - run: node tests/identity-profile.browser.cjs
    - run: node tests/provider-console.browser.cjs
      env:
        AXS_SCREENSHOT_DIR: screenshots/provider-console
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: provider-console-responsive
        path: frontend-next/screenshots/provider-console/

  frontend-roles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-next/package-lock.json
    - run: npm ci
    - run: npm run test:roles
    - run: npx next typegen && npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests with coverage
      timeout-minutes: 5
      run: |
        pytest tests/ --cov=backend --cov-report=term --cov-report=xml --cov-report=html -v -o faulthandler_timeout=60
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Archive coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30
    
    - name: Check coverage threshold
      run: coverage report --fail-under=40
